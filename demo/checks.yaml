# Semantic data-quality checks for the silver layer (station 1).
#
# A Noul check is a predicate on the value: it is read as "Does `value` pass this check: it <check>?".
# A Choice check maps the value to one code; picking `other` counts as failing.
# action: warn (rejected rows only counted) | quarantine (rejected rows always go to the
#         quarantine table) | fail_run (as quarantine, and the run fails closed when triggered).
# max_fail_rate: share of rows Jev rejects above which the check is triggered in the manifest.

checks:
  - id: address_is_postal
    column: address
    kind: noul
    check: identifies one specific building by its street name and its own house number
    max_fail_rate: 0.50
    action: quarantine

  - id: description_names_product
    column: product_description
    kind: noul
    check: describes the product itself, rather than referring to information kept elsewhere
    max_fail_rate: 0.10
    action: fail_run

  - id: cancel_reason_code
    column: cancel_reason
    kind: choice
    check: Which cancellation code does `value` describe?
    codes:
      TOO_EXPENSIVE: the price or cost was the reason
      DELIVERY_LATE: the delivery did not arrive on time
      WRONG_OR_DAMAGED: what arrived was not what was ordered, or was damaged
      NO_LONGER_NEEDED: the buyer no longer needs or wants what was ordered, because their own plans or funding changed or it was ordered by mistake
      SWITCHED_SUPPLIER: the buyer now gets it from another supplier
      other: none of the other codes fit
    max_fail_rate: 0.30
    action: warn

# Prompt variants of checks.yaml that did worse, compared against it in notebooks/01_dq.ipynb.
# Same ids, so the notebook's labels apply to both; never share a Cache between the two files.
#
# A Choice check with a `question` is split: the Choice (`question`) only picks the code, and a
# separate Noul on `check` scores pass/fail, with the code descriptions in state as `codes`.

checks:
  # The previous wording: lists an address's parts, with postcode/city optional.
  - id: address_is_postal
    column: address
    kind: noul
    check: is a postal address (street + number, optionally postcode/city)
    max_fail_rate: 0.50
    action: quarantine

  - id: description_names_product
    column: product_description
    kind: noul
    check: describes the product itself, rather than referring to information kept elsewhere
    max_fail_rate: 0.10
    action: fail_run

  - id: cancel_reason_code
    column: cancel_reason
    kind: choice
    check: gives a cancellation reason that fits one of `codes`
    question: Which cancellation code does `value` describe?
    codes:
      TOO_EXPENSIVE: the price or cost was the reason
      DELIVERY_LATE: the delivery did not arrive on time
      WRONG_OR_DAMAGED: what arrived was not what was ordered, or was damaged
      NO_LONGER_NEEDED: the buyer no longer needs or wants what was ordered, because their own plans or funding changed or it was ordered by mistake
      SWITCHED_SUPPLIER: the buyer now gets it from another supplier
      other: none of the other codes fit
    max_fail_rate: 0.30
    action: warn
